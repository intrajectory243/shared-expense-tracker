# Base compose — production shape. Runs the code baked into the image
# (deploy = rebuild), auto-restarts, no --reload.
#
#   Production:  docker compose -f docker-compose.yml up -d --build
#   Development: docker compose up            (also loads docker-compose.override.yml)
#
# See DEPLOY.md.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8130:8000"
    volumes:
      - db-data:/app/backend/data
    environment:
      - DATABASE_URL=sqlite:////app/backend/data/expense_tracker.db
    env_file:
      - path: backend/.env
        required: false
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  db-data:
