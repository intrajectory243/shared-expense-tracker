# Development overrides — loaded automatically by `docker compose` (but NOT
# when a command passes explicit -f flags, which is how production runs).
# Bind-mounts the source for hot-reload; no auto-restart.
services:
  app:
    restart: "no"
    volumes:
      - ./frontend:/app/frontend:ro
      - ./backend/app:/app/backend/app:ro
      - ./backend/tests:/app/backend/tests:ro
      - ./backend/pytest.ini:/app/backend/pytest.ini:ro
      - ./backend/scripts:/app/backend/scripts:ro
      - ./backend/alembic:/app/backend/alembic
      - ./backend/alembic.ini:/app/backend/alembic.ini:ro
      - ./backend/alembic_household.ini:/app/backend/alembic_household.ini:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
