# Config for the SHARED-database migration stream (User/Household/
# AppSetting/PushSubscription -- see app/database.py). The actual DB URL
# comes from app.config.settings, not a placeholder here.
#
# Per-household migrations (Expense/ExpenseParticipant/Settlement/
# BalanceCache) are a separate stream with no single default database --
# app/household_db.py and app/migrations.py drive alembic_household.ini
# programmatically, setting sqlalchemy.url to whichever household file is
# in play at that moment. To hand-author a new household migration from the
# CLI: edit alembic_household.ini's sqlalchemy.url to point at a real
# household file already at head (autogenerate needs something to diff
# against), then run `alembic -c alembic_household.ini revision
# --autogenerate -m "..."`.

[alembic]
script_location = alembic/shared
prepend_sys_path = .
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
