# CLI convenience config for hand-authoring migrations in the per-household
# stream -- see the comment in alembic.ini. Not used at runtime: app/
# household_db.py and app/migrations.py build their own Config objects and
# set sqlalchemy.url programmatically per household file, they don't read
# this. Edit sqlalchemy.url below to a real household file before running
# `alembic -c alembic_household.ini revision --autogenerate -m "..."`.

[alembic]
script_location = alembic/household
sqlalchemy.url = sqlite:///data/households/example.db
prepend_sys_path = .
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
